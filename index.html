<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <!-- Bootstrap CSS for grid layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #ffffff; 
            color: #000000; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card { 
            background-color: #ffffff; 
            border: 2px solid #000000; 
            border-radius: 0; 
            width: 100%; 
            max-width: 400px; 
        }
        .form-control { 
            background-color: #ffffff; 
            color: #000000; 
            border: 1px solid #000000; 
            border-radius: 0; 
        }
        .form-control:focus {
            box-shadow: none;
            border: 2px solid #000000;
        }
        .btn { 
            background-color: #ffffff; 
            color: #000000; 
            border: 2px solid #000000; 
            border-radius: 0; 
            font-weight: bold;
        }
        /* Invert colors on hover instead of using gray hehe */
        .btn:hover { 
            background-color: #000000; 
            color: #ffffff; 
        }
        a { 
            color: #000000; 
            text-decoration: underline; 
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Login  -->
    <div class="container d-flex justify-content-center">
        <div class="card p-4">
            <h3 class="text-center mb-4" style="font-weight: bold;">System Login</h3>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label" style="font-weight: bold;">Username</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" style="font-weight: bold;">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                
                <div class="d-grid gap-3 mt-4">
                    <button type="button" class="btn" onclick="login('customer')">Login as Customer</button>
                    <button type="button" class="btn" onclick="login('admin')">Login as Admin</button>
                </div>
                
                <div class="text-center mt-4">
                    <a href="#" onclick="alert('Registration disabled for this demo.')">Register Account</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Login Logic -->
    <script>
        function login(role) {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;

            if(user === "" || pass === "") {
                alert("Enter any username and password to proceed.");
                return;
            }

            if (role === 'customer') {
                window.location.href = 'customer.html';
            } else if (role === 'admin') {
                window.location.href = 'admin.html';
            }
        }
    </script>
</body>
</html>
