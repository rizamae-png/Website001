<!-- Sa source control mayroon iyung pull commit and push
 Kapag may binago ka rito lagi ka muna mag pupull then you type a commit message
 then you click pull para hindi masira yung branching na tinatawag
 
 You have notes naman sa isang code mo doon ko inilagay you should put it in your phone
 I'll send more commands din when you want to pull commit push via vscode terminal
 
 
 Yung nasa kanan ng codefile like M and U those two means Modified and Untracked
 Kapag Untracked meaning ay wala pa sa github, kapag Modified, ay may binago ka
 
 Kapag walang M or U it means na push mo na(or na upload mo na) yung code sa github
 
 Remember:
 Go to source control
 in changes add the files you want to push
 CLick Pull
 Enter a commit message 
 CLick Commit
 Then click push
 
 To see all the codes the Blue make and the pink cloud origin/main must be both at the top
 when you see the graph sa source control-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <!-- Bootstrap CSS for grid layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        
        body { 
            background-color: #ffffff; 
            color: #000000; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card { 
            background-color: #ffffff; 
            border: 2px solid #000000; 
            border-radius: 0; 
            width: 100%; 
            max-width: 400px; 
        }
        .form-control { 
            background-color: #ffffff; 
            color: #000000; 
            border: 1px solid #000000; 
            border-radius: 0; 
        }
        .form-control:focus {
            box-shadow: none;
            border: 2px solid #000000;
        }
        .form-control:user-invalid {
            border: 2px solid #cc0000;
        }
        .required-mark {
            color: #cc0000;
        }
        .btn { 
            background-color: #ffffff; 
            color: #000000; 
            border: 2px solid #000000; 
            border-radius: 0; 
            font-weight: bold;
        }
        /* Invert --colors on hover- instead of using gray hehe */
        .btn:hover { 
            background-color: #000000; 
            color: #ffffff; 
        }
        a { 
            color: #000000; 
            text-decoration: underline; 
            font-weight: bold;
        }
        /* Show the register message only when the link is clicked */
        #register-msg {
            display: none;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        #register-msg:target {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Login -->
    <div class="container d-flex justify-content-center">
        <div class="card p-4">
            <h3 class="text-center mb-4" style="font-weight: bold;">System Login</h3>
            
            <!-- Browser blocks submit until required fields are filled -->
            <form>
                <div class="mb-3">
                    <label for="username" class="form-label" style="font-weight: bold;">
                        Username <span class="required-mark">*</span>
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" style="font-weight: bold;">
                        Password <span class="required-mark">*</span>
                    </label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >
                </div>
                
                <div class="d-grid gap-3 mt-4">
                    <button type="submit" class="btn" formaction="customer.html">Login as Customer</button>
                    <button type="submit" class="btn" formaction="admin.html">Login as Admin</button>
                </div>
                
                <div class="text-center mt-4">
                    <a href="#register-msg">Register Account</a>
                    <p id="register-msg">Registration disabled for this demo.</p>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
