<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Print Order System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; }
        .navbar { margin-bottom: 30px; }
    </style>
</head>
<body>

    <!-- Navigation Bar for Admin -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand text-info" href="#">Admin Control Panel</a>
            <div class="d-flex">
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container">
        
        <!-- Header for Admin Actions -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Order Management</h3>
            <span class="text-muted">Review and update customer orders</span>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <!-- Order Management Table -->
                    <table class="table table-dark table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer Name</th>
                                <th>File & Details</th>
                                <th>Quantity</th>
                                <th>Update Order Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Mock Data Row 1 -->
                            <tr id="row-1001">
                                <td>#1001</td>
                                <td>Juan Dela Cruz</td>
                                <td>Chapter1.pdf<br><small class="text-muted">A4 | Regular</small></td>
                                <td>3</td>
                                <td>
                                    <!-- Dropdown for Update Order Status -->
                                    <select class="form-select form-select-sm" id="status-1001">
                                        <option value="Pending" selected>Pending</option>
                                        <option value="Printing">Printing</option>
                                        <option value="Ready">Ready for Pickup</option>
                                        <option value="Completed">Completed</option>
                                    </select>
                                </td>
                                <td>
                                    <button class="btn btn-primary btn-sm" onclick="updateStatus('1001')">Save</button>
                                </td>
                            </tr>
                            
                            <!-- Mock Data Row 2 -->
                            <tr id="row-1002">
                                <td>#1002</td>
                                <td>Maria Santos</td>
                                <td>Presentation.pptx<br><small class="text-muted">Letter | Glossy</small></td>
                                <td>1</td>
                                <td>
                                    <select class="form-select form-select-sm" id="status-1002">
                                        <option value="Pending">Pending</option>
                                        <option value="Printing" selected>Printing</option>
                                        <option value="Ready">Ready for Pickup</option>
                                        <option value="Completed">Completed</option>
                                    </select>
                                </td>
                                <td>
                                    <button class="btn btn-primary btn-sm" onclick="updateStatus('1002')">Save</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Admin JavaScript Actions -->
    <script>
        function logout() {
            // Return to login
            window.location.href = 'index.html';
        }

        function updateStatus(orderId) {
            // Find the selected dropdown value for the specific order row
            let statusDropdown = document.getElementById('status-' + orderId);
            let newStatus = statusDropdown.value;
            
            // In a real app, this would send data to your database via backend. 
            // Here, we just show a front-end alert.
            alert("Success! Order #" + orderId + " status has been updated to: " + newStatus);
            
            // Optional visual feedback: change row color if completed
            if(newStatus === "Completed") {
                document.getElementById('row-' + orderId).classList.add("table-success");
            } else {
                document.getElementById('row-' + orderId).classList.remove("table-success");
            }
        }
    </script>
</body>
</html>
